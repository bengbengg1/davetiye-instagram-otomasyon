name: Davetiye Instagram - Kutuphane kur / durum

on:
  workflow_dispatch:
    inputs:
      action:
        description: '49 baslik + 3 aciklama + 14 sarki kaydet veya durumu gor'
        required: true
        type: choice
        default: seed
        options:
          - seed
          - status

permissions:
  contents: read

concurrency:
  group: davetiye-instagram-studio
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ASSETS_BUCKET: piyaso-tiktok-assets
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-davetiye.txt
      - name: Davetiye Instagram kutuphane
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == 'seed' ]]; then
            python davetiye_instagram.py seed
          else
            python davetiye_instagram.py status
          fi
