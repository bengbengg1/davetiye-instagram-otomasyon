name: Davetiye Instagram - R2 klasorlerini hazirla
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ASSETS_BUCKET: piyaso-tiktok-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-davetiye.txt
      - name: Yalnizca Instagram prefixlerini olustur
        run: |
          python - <<'PY'
          import os, boto3
          client=boto3.client('s3',region_name='auto',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
          b='piyaso-tiktok-assets'
          client.head_bucket(Bucket=b)
          for p in ('inbox/','plan/pending/','drafts/','state/days/','state/used-media/','state/used-plan/'):
              key='davetiye-instagram/'+p+'.keep'
              client.put_object(Bucket=b,Key=key,Body=b'',ContentType='application/octet-stream')
              print('HAZIR',key)
          PY
